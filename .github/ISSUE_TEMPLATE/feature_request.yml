name: Feature request
description: Suggest a tool, shortcut, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Pixel Pad deliberately stays small. Explain the problem first; a
        concrete workflow is more persuasive than a long feature list.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow that is currently awkward or impossible.
      placeholder: I sketch on a tablet and cannot tell which tool is active without looking away from the canvas.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the smallest version of the change that would help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Existing shortcuts, workarounds, or tools that already solve part of this.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, references, or examples from other pixel editors.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
