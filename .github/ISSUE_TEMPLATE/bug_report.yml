name: Bug report
description: Something in the editor, library, or export is broken.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include passwords, session cookies,
        or security vulnerabilities here — use the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: The fill tool also recolours the checkerboard background.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that reliably shows the problem.
      placeholder: |
        1. Open the studio with a 16×16 grid.
        2. Pick the fill tool and a red colour.
        3. Click an empty cell.
        4. Observe ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and whether you were signed in.
      placeholder: Firefox 132 on macOS 15, signed out
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL or commit
      description: The live demo URL, or the commit you built locally.
      placeholder: https://pixel-pad-bdsa.netlify.app
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console output, or anything else
      description: Drag images in, or paste relevant console errors.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
